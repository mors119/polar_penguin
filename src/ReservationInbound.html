<!doctype html>
<html><head><base target="_top"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font-family:"Malgun Gothic",sans-serif;margin:0;color:#172033;background:#f5f7fa}header{padding:18px 22px;background:#1f3864;color:#fff}h1{font-size:21px;margin:0 0 4px}.sub{font-size:12px;opacity:.88}main{display:grid;grid-template-columns:52% 48%;height:680px}.pane{padding:16px;overflow:auto}.pane+.pane{border-left:1px solid #cbd3df;background:#fff}table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}th{position:sticky;top:0;background:#e8edf3;color:#24364f;text-align:left}th,td{padding:9px 7px;border-bottom:1px solid #dce2ea}tbody tr[data-sku]{cursor:pointer}tbody tr[data-sku]:hover,tbody tr.active{background:#eaf2ff}.num{text-align:right}.pill{padding:3px 7px;border-radius:12px;background:#e8edf3;white-space:nowrap}.ok{background:#dff1df;color:#216e39}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.card{background:#f2f6fa;border:1px solid #d7deea;border-radius:6px;padding:10px}.card b{display:block;font-size:18px;margin-top:4px}.inbound{margin:14px 0;padding:14px;border:1px solid #b9c8dc;border-radius:7px;background:#f8fbff}.inbound label{display:block;font-weight:bold;margin-bottom:6px}.inbound input{width:150px;padding:9px;border:1px solid #aab6c7;border-radius:5px;font-size:16px}.section{margin-top:18px}.section h3{font-size:14px;margin:0 0 8px;color:#1f3864}.reason{color:#a33;font-size:11px;margin-top:3px}.muted{color:#6b7280}.actions{position:sticky;bottom:0;background:#fff;padding:14px 0 2px;text-align:right;border-top:1px solid #ddd}button{border:0;border-radius:5px;padding:9px 16px;cursor:pointer}.primary{background:#1f3864;color:#fff}.secondary{background:#e8edf3;margin-right:7px}button:disabled{opacity:.45;cursor:default}#message{padding:9px 12px;margin-bottom:10px;border-radius:5px;display:none;white-space:pre-wrap}.error{display:block!important;background:#ffe4e4;color:#8d2222}.success{display:block!important;background:#e2efda;color:#205c28}.warning{display:block!important;background:#fff3cd;color:#705600}
</style></head><body>
<header><h1>예약상품 입고 관리</h1><div class="sub">Input 파일이 없는 F 상품의 실물 입고를 delta로 반영하고, 새 입고와 기존 미사용 물리 재고로 FIFO 전체 주문만 피킹합니다.</div></header>
<main><section class="pane"><div id="message"></div><table><thead><tr><th>SKU / 상품</th><th class="num">현재 재고</th><th class="num">대기 주문</th><th class="num">대기 수량</th><th>상태</th></tr></thead><tbody id="products"><tr><td colspan="5">불러오는 중…</td></tr></tbody></table></section><section class="pane" id="detail"><p class="muted">왼쪽에서 재고관리=F 상품을 선택하세요.</p></section></main>
<script>
let selectedSku='',lastPreview=null,submitting=false,requestId='';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateText(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?esc(v):String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}
function setMessage(text,type='error'){const m=document.getElementById('message');m.className=type;m.textContent=text}
function fail(e){setMessage(e&&e.message?e.message:e);submitting=false;const btn=document.getElementById('apply');if(btn){btn.disabled=false;btn.textContent='입고 반영 및 피킹';}}
function qtyValue(){const input=document.getElementById('inboundQty');if(!input)return 0;const raw=input.value.trim();if(!/^\d+$/.test(raw))throw new Error('이번 입고 수량은 0 이상의 정수여야 합니다.');return Number(raw)}
function newRequestId(){return 'inb_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,14)}
function loadProducts(){document.getElementById('products').innerHTML='<tr><td colspan="5">불러오는 중…</td></tr>';google.script.run.withSuccessHandler(renderProducts).withFailureHandler(fail).getReservationProductSummary()}
function renderProducts(rows){const body=document.getElementById('products');body.innerHTML=rows.length?rows.map(r=>`<tr data-sku="${esc(r.sku)}"><td><b>${esc(r.sku)}</b><br>${esc(r.name)} ${esc(r.option)}</td><td class="num">${r.available}</td><td class="num">${r.reservationOrderCount}건</td><td class="num">${r.reservationQuantity}개</td><td><span class="pill ${r.releasableOrderCount?'ok':''}">${esc(r.status)}</span></td></tr>`).join(''):'<tr><td colspan="5">재고관리=F 상품이 없습니다.</td></tr>';body.querySelectorAll('tr[data-sku]').forEach(tr=>tr.onclick=()=>selectProduct(tr.dataset.sku,tr))}
function selectProduct(sku,tr){selectedSku=sku;lastPreview=null;requestId='';document.querySelectorAll('#products tr').forEach(x=>x.classList.remove('active'));if(tr)tr.classList.add('active');document.getElementById('detail').innerHTML='<p>입고 정보를 불러오는 중…</p>';google.script.run.withSuccessHandler(renderDetail).withFailureHandler(fail).getReservationInboundPreview(sku,0)}
function orderRows(rows,waiting){if(!rows.length)return '<p class="muted">없음</p>';return `<table><thead><tr><th>주문일</th><th>주문번호</th><th class="num">선택상품</th><th class="num">전체</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${dateText(o.orderDate)}</td><td><b>${esc(o.orderNo)}</b>${o.recipient?`<br><span class="muted">${esc(o.recipient)}</span>`:''}${waiting?`<div class="reason">${esc(o.reason)}</div>`:''}</td><td class="num">${o.targetQuantity}</td><td class="num">${o.totalQuantity}</td></tr>`).join('')}</tbody></table>`}
function renderDetail(d){lastPreview=d;document.getElementById('detail').innerHTML=`<h2>${esc(d.name)} <small>${esc(d.option)}</small></h2><div class="muted">SKU: ${esc(d.sku)}</div><div class="cards"><div class="card">현재 재고<b>${d.available}</b></div><div class="card">대기 주문<b>${d.reservationOrderCount}건</b></div><div class="card">대기 수량<b>${d.reservationQuantity}개</b></div></div><div class="inbound"><label for="inboundQty">이번 입고 수량</label><input id="inboundQty" type="number" min="0" step="1" value="${d.inboundQuantity}" oninput="lastPreview=null;requestId=''"> <span class="muted">현재 재고에 더하는 delta</span></div><div class="cards"><div class="card">입고 반영 후 재고<b>${d.inventoryAfterInbound}</b></div><div class="card">FIFO 출고 가능 주문<b>${d.releaseOrderCount}건</b></div><div class="card">FIFO 출고 가능 수량<b>${d.releaseQuantity}개</b></div><div class="card">기존 미사용 물리 재고<b>${d.existingSecuredQuantity}개</b></div><div class="card">사용 가능 물리 재고<b>${d.effectiveReleasableQuantity}개</b></div><div class="card">미사용 입고 수량<b>${d.unusedInboundQuantity}개</b></div></div><div class="section"><h3>FIFO 피킹 대상 · ${d.releaseOrderCount}건</h3>${orderRows(d.selected,false)}</div><div class="section"><h3>대기 유지 · ${d.waiting.length}건</h3>${orderRows(d.waiting,true)}</div><div class="actions"><button class="secondary" onclick="previewInbound()">미리보기</button><button id="apply" class="primary" onclick="confirmAndApply()">입고 반영 및 피킹</button></div>`}
function previewInbound(){try{const qty=qtyValue();google.script.run.withSuccessHandler(renderDetail).withFailureHandler(fail).getReservationInboundPreview(selectedSku,qty)}catch(e){fail(e)}}
function confirmAndApply(){if(submitting||!selectedSku)return;let qty;try{qty=qtyValue()}catch(e){fail(e);return}const proceed=p=>{lastPreview=p;const summary=`예약상품 수동 입고\n\nSKU: ${p.sku}\n현재 재고: ${p.available}\n이번 입고: +${p.inboundQuantity}\n반영 후 재고: ${p.inventoryAfterInbound}\n\n대기 주문: ${p.reservationOrderCount}건\n대기 수량: ${p.reservationQuantity}개\n\nFIFO 기준 예상 출고:\n${p.releaseOrderCount}건 / ${p.releaseQuantity}개\n미사용 입고 수량: ${p.unusedInboundQuantity}개\n\n계속하시겠습니까?`;if(!window.confirm(summary))return;submitting=true;requestId=requestId||newRequestId();const btn=document.getElementById('apply');btn.disabled=true;btn.textContent='입고 반영 및 피킹 중…';google.script.run.withSuccessHandler(showResult).withFailureHandler(e=>{submitting=false;btn.disabled=false;btn.textContent='입고 반영 및 피킹';setMessage((e&&e.message?e.message:e)+'\n같은 요청을 다시 제출하지 말고 재고이동로그와 피킹지시서 조회/재출력을 확인하세요.');}).applyManualReservationInbound(selectedSku,qty,requestId)};if(!lastPreview||lastPreview.inboundQuantity!==qty){google.script.run.withSuccessHandler(proceed).withFailureHandler(fail).getReservationInboundPreview(selectedSku,qty)}else proceed(lastPreview)}
function showResult(r){submitting=false;const title=r.duplicate?'중복 요청 차단':(r.created?'입고 반영 및 FIFO 피킹 완료':'입고 반영 완료');document.getElementById('detail').innerHTML=`<div id="message" class="${r.duplicate?'warning':'success'}"><b>${esc(title)}</b></div><h2>${esc(r.name||r.sku||selectedSku)}</h2><p>이번 입고: <b>+${r.inboundQuantity||0}개</b><br>반영 후 재고: <b>${r.inventoryAfterInbound}</b><br>FIFO 출고: <b>${r.orderCount||0}건 / ${r.releaseQuantity||0}개</b><br>미사용 물리 재고: <b>${r.unusedSecuredQuantity||0}개</b><br>대기 주문: <b>${r.waitingOrderCount||0}건</b><br>대기 수량: <b>${r.waitingQuantity||0}개</b>${r.instructionNo?`<br>피킹지시번호: <b>${esc(r.instructionNo)}</b>`:''}</p><p class="muted">${esc(r.message||'')}</p><div class="actions"><button class="secondary" onclick="google.script.host.close()">닫기</button><button class="primary" onclick="loadProducts();document.getElementById('detail').innerHTML='<p class=muted>상품을 다시 선택하세요.</p>'">목록 새로고침</button></div>`;loadProducts()}
loadProducts();
</script></body></html>
