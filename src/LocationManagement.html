<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:13px "Malgun Gothic",sans-serif;color:#20242a;margin:0;padding:16px}h1{font-size:19px;color:#1f3864;margin:0 0 4px}.sub{color:#667085;margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}input[type=search]{width:320px;padding:7px;border:1px solid #98a2b3;border-radius:4px}button{border:0;border-radius:4px;padding:7px 14px;background:#1f3864;color:#fff;cursor:pointer}button.secondary{background:#667085}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #d0d5dd;padding:5px}th{background:#e8edf3}td.num{text-align:right}.location{width:150px;padding:6px;border:1px solid #98a2b3;border-radius:3px}.message{padding:8px 0;color:#067647}.error{color:#b42318}
</style></head><body><h1>상품 위치 관리</h1><div class="sub">기본보관위치는 창고 소유 정보이며 재고 동기화가 덮어쓰지 않습니다.</div>
<div class="toolbar"><input id="search" type="search" placeholder="상품코드, 상품명, 옵션, 위치 검색"><label><input id="all" type="checkbox"> 전체 상품 보기</label><button class="secondary" onclick="load()">검색</button><button onclick="saveAll()">전체 저장</button></div>
<div id="message"></div><table><thead><tr><th>상품품목코드</th><th>상품명</th><th>옵션</th><th>가용재고</th><th>현재 위치</th><th>새 위치</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fail(e){document.getElementById('message').innerHTML='<div class="error">'+esc(e&&e.message?e.message:e)+'</div>'}
function load(){document.getElementById('rows').innerHTML='<tr><td colspan="6">불러오는 중…</td></tr>';google.script.run.withSuccessHandler(render).withFailureHandler(fail).getProductsForLocationManagement(document.getElementById('search').value,document.getElementById('all').checked)}
function render(items){document.getElementById('rows').innerHTML=items.length?items.map(i=>`<tr data-sku="${esc(i.sku)}"><td><b>${esc(i.sku)}</b></td><td>${esc(i.productName)}</td><td>${esc(i.option||'-')}</td><td class="num">${i.available}</td><td>${esc(i.location||'(위치 미지정)')}</td><td><input class="location" value="${esc(i.location)}" placeholder="예: A-01-03"></td></tr>`).join(''):'<tr><td colspan="6">조건에 맞는 상품이 없습니다.</td></tr>'}
function saveAll(){const updates=[...document.querySelectorAll('tr[data-sku]')].map(tr=>({sku:tr.dataset.sku,location:tr.querySelector('.location').value.trim()}));google.script.run.withSuccessHandler(r=>{const failures=r.failed.map(x=>esc(x.sku||'(상품코드 없음)')+': '+esc(x.reason)).join('<br>');document.getElementById('message').innerHTML=`<div class="message">${r.updated}건 저장${r.failed.length?' · 실패 '+r.failed.length+'건':''}</div>${failures?'<div class="error">'+failures+'</div>':''}`;load()}).withFailureHandler(fail).saveProductLocations(updates)}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')load()});document.getElementById('all').addEventListener('change',load);load();
</script></body></html>
