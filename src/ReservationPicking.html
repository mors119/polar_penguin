<!doctype html><html><head><base target="_top"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font-family:"Malgun Gothic",sans-serif;margin:0;color:#172033;background:#f5f7fa}header{padding:18px 22px;background:#1f3864;color:#fff}h1{font-size:21px;margin:0 0 4px}.sub{font-size:12px;opacity:.85}main{display:grid;grid-template-columns:54% 46%;height:680px}.pane{padding:16px;overflow:auto}.pane+.pane{border-left:1px solid #cbd3df;background:#fff}table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}th{position:sticky;top:0;background:#e8edf3;color:#24364f;text-align:left}th,td{padding:9px 7px;border-bottom:1px solid #dce2ea}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.active{background:#eaf2ff}.num{text-align:right}.pill{padding:3px 7px;border-radius:12px;background:#e8edf3;white-space:nowrap}.ok{background:#dff1df;color:#216e39}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.card{background:#f2f6fa;border:1px solid #d7deea;border-radius:6px;padding:10px}.card b{display:block;font-size:18px;margin-top:4px}.section{margin-top:18px}.section h3{font-size:14px;margin:0 0 8px;color:#1f3864}.reason{color:#a33;font-size:11px;margin-top:3px}.muted{color:#6b7280}.actions{position:sticky;bottom:0;background:#fff;padding:14px 0 2px;text-align:right;border-top:1px solid #ddd}button{border:0;border-radius:5px;padding:9px 16px;cursor:pointer}.primary{background:#1f3864;color:#fff}.secondary{background:#e8edf3;margin-right:7px}button:disabled{opacity:.45;cursor:default}#message{padding:9px 12px;margin-bottom:10px;border-radius:5px;display:none}.error{display:block!important;background:#ffe4e4;color:#8d2222}.success{display:block!important;background:#e2efda;color:#205c28}
</style></head><body><header><h1>예약 주문 피킹 관리</h1><div class="sub">대기 주문의 상품을 선택하면 시스템이 원본 주문일시가 있을 때 FIFO로, 없으면 안정적인 주문번호 순으로 주문 전체 재고를 계산합니다. 고객 주문을 직접 고르지 않습니다.</div></header><main><section class="pane"><div id="message"></div><table><thead><tr><th>상품코드 / 상품</th><th class="num">예약</th><th class="num">가용</th><th class="num">이번 출고</th><th class="num">잔여</th><th>상태</th></tr></thead><tbody id="products"><tr><td colspan="6">불러오는 중…</td></tr></tbody></table></section><section class="pane" id="detail"><p class="muted">왼쪽에서 대기 주문 상품을 선택하세요.</p></section></main><script>
let selectedSku='';const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dateText(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?esc(v):String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}function fail(e){const m=document.getElementById('message');m.className='error';m.textContent=e&&e.message?e.message:e}function loadProducts(){document.getElementById('products').innerHTML='<tr><td colspan="6">불러오는 중…</td></tr>';google.script.run.withSuccessHandler(renderProducts).withFailureHandler(fail).getReservationProductSummary_()}function renderProducts(rows){const body=document.getElementById('products');body.innerHTML=rows.length?rows.map(r=>`<tr data-sku="${esc(r.sku)}"><td><b>${esc(r.sku)}</b><br>${esc(r.name)} ${esc(r.option)}</td><td class="num">${r.reservationOrderCount}건 / ${r.reservationQuantity}개</td><td class="num">${r.available}</td><td class="num">${r.releasableOrderCount}건 / ${r.releasableQuantity}개</td><td class="num">${r.remaining}</td><td><span class="pill ${r.releasableOrderCount?'ok':''}">${esc(r.status)}</span></td></tr>`).join(''):'<tr><td colspan="6">대기 중인 예약 주문이 없습니다.</td></tr>';body.querySelectorAll('tr[data-sku]').forEach(tr=>tr.onclick=()=>selectProduct(tr.dataset.sku,tr))}function selectProduct(sku,tr){selectedSku=sku;document.querySelectorAll('#products tr').forEach(x=>x.classList.remove('active'));if(tr)tr.classList.add('active');document.getElementById('detail').innerHTML='<p>FIFO 대상을 계산하는 중…</p>';google.script.run.withSuccessHandler(renderDetail).withFailureHandler(fail).getReservationProductPreview_(sku)}function orderRows(rows,waiting){if(!rows.length)return '<p class="muted">없음</p>';return `<table><thead><tr><th>주문일</th><th>주문번호</th><th class="num">선택상품</th><th class="num">전체</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${dateText(o.orderDate)}</td><td><b>${esc(o.orderNo)}</b>${o.recipient?`<br><span class="muted">${esc(o.recipient)}</span>`:''}${waiting?`<div class="reason">${esc(o.reason)}</div>`:''}</td><td class="num">${o.targetQuantity}</td><td class="num">${o.totalQuantity}</td></tr>`).join('')}</tbody></table>`}function renderDetail(d){document.getElementById('detail').innerHTML=`<h2>${esc(d.name)} <small>${esc(d.option)}</small></h2><div class="muted">${esc(d.sku)}</div><div class="cards"><div class="card">가용재고<b>${d.available}</b></div><div class="card">예약 총수량<b>${d.reservationQuantity}</b></div><div class="card">이번 출고<b>${d.releaseQuantity}</b></div><div class="card">예상 잔여<b>${d.remaining}</b></div></div><div class="section"><h3>이번 피킹 대상 · ${d.releaseOrderCount}건</h3>${orderRows(d.selected,false)}</div><div class="section"><h3>대기 유지 · ${d.waiting.length}건</h3>${orderRows(d.waiting,true)}</div><div class="actions"><button class="secondary" onclick="loadProducts()">새로고침</button><button id="create" class="primary" ${d.releaseOrderCount?'':'disabled'} onclick="createBatch()">피킹서 생성</button></div>`}function createBatch(){if(!selectedSku)return;const btn=document.getElementById('create');btn.disabled=true;btn.textContent='서버 재검증 및 생성 중…';google.script.run.withSuccessHandler(result=>{if(!result.created){fail(result.message);selectProduct(selectedSku,document.querySelector('[data-sku="'+selectedSku.replace(/"/g,'\\"')+'"]'));return}document.getElementById('detail').innerHTML=`<div id="message" class="success"><b>피킹 PDF 및 출고 처리 완료</b></div><h2>${esc(result.name)}</h2><p>생성된 배치: <b>${esc(result.instructionNo)}</b></p><p>주문: <b>${result.orderCount}건</b><br>선택상품 출고: <b>${result.releaseQuantity}개</b><br>총 피킹 수량: <b>${result.totalPickingQuantity}개</b><br>잔여 선택상품 재고: <b>${result.remaining}개</b><br>예약 유지: <b>${result.waitingOrderCount}건</b></p><div class="actions"><button class="secondary" onclick="google.script.host.close()">닫기</button><button class="primary" onclick="loadProducts();document.getElementById('detail').innerHTML='<p class=muted>상품을 다시 선택하세요.</p>'">새로고침</button></div>`;loadProducts()}).withFailureHandler(e=>{fail(e);btn.disabled=false;btn.textContent='피킹서 생성'}).createReservationPickingBatch_(selectedSku)}loadProducts();
</script></body></html>
