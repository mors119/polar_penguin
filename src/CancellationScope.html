<!doctype html><html><head><base target="_top"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:13px "Malgun Gothic",sans-serif;color:#20242a;margin:0;background:#f5f7fa}header{padding:16px 20px;background:#1f3864;color:#fff}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.85;margin-top:4px}main{padding:16px 20px}.card{background:#fff;border:1px solid #d6dce5;border-radius:7px;padding:12px;margin-bottom:12px}.context{display:grid;grid-template-columns:80px 1fr;gap:5px}.muted{color:#667085}.note{background:#fff4d6;color:#7a4d00;padding:9px;border-radius:5px;margin-bottom:12px}.scope{display:block;border:1px solid #d6dce5;border-radius:6px;padding:10px;margin:7px 0;background:#fff;cursor:pointer}.scope input{margin-right:7px}.summary{display:block;color:#667085;margin:4px 0 0 25px}.preview{max-height:220px;overflow:auto}.order{padding:8px 0;border-bottom:1px solid #e4e7ec}.order:last-child{border-bottom:0}.item{color:#667085;margin:3px 0 0 13px}select{width:100%;padding:8px;border:1px solid #98a2b3;border-radius:5px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}button{border:0;border-radius:5px;padding:9px 16px;cursor:pointer}.primary{background:#1f3864;color:#fff}.secondary{background:#e8edf3}button:disabled{opacity:.5;cursor:default}.error{background:#ffe4e4;color:#8d2222;padding:9px;border-radius:5px;margin-bottom:10px}.success{background:#e2efda;color:#205c28;padding:12px;border-radius:6px}.failure{color:#b42318;margin-top:6px}
</style></head><body><header><h1>주문 취소</h1><div class="sub">선택한 행이 아니라 주문번호 전체가 취소됩니다.</div></header><main id="app"><p>취소 대상을 불러오는 중…</p></main><script>
const selectedOrderNo=<?!= orderNoJson ?>;let context=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fail(e){const msg=esc(e&&e.message?e.message:e);const errDiv=document.getElementById('modal-error');if(errDiv){errDiv.innerHTML=msg;errDiv.style.display='block';}else{document.getElementById('app').innerHTML='<div class="error">'+msg+'</div><div class="actions"><button class="secondary" onclick="google.script.host.close()">닫기</button></div>';}const btn=document.getElementById('execute');if(btn){btn.disabled=false;btn.textContent='취소 실행';}}
function summary(s){return `${s.orderCount}건 / 총 수량 ${s.totalQuantity}개`}
function previewHtml(orders){return orders.map(o=>`<div class="order"><b>${esc(o.orderNo)}</b>${o.items.map(i=>`<div class="item">${esc(i.name)} ×${i.quantity}</div>`).join('')}</div>`).join('')}
function selectedScope(){const checked=document.querySelector('input[name=scope]:checked');return checked?checked.value:'SINGLE'}
function updatePreview(){const bulk=selectedScope()==='RECIPIENT';const s=bulk?context.bulkSummary:context.singleSummary;document.getElementById('preview').innerHTML=`<b>취소 대상</b>${previewHtml(s.orders)}<p><b>총 ${s.orderCount}건 / ${s.totalQuantity}개</b></p>`}
function render(c){context=c;const scopes=c.bulkAvailable?`<label class="scope"><input type="radio" name="scope" value="SINGLE" checked>선택한 주문번호만 취소<span class="summary">${summary(c.singleSummary)}</span></label><label class="scope"><input type="radio" name="scope" value="RECIPIENT">동일 수령인의 주문 전체 취소<span class="summary">${summary(c.bulkSummary)}</span></label>`:'<input type="hidden" name="scope" value="SINGLE">';document.getElementById('app').innerHTML=`<div id="modal-error" class="error" style="display:none"></div><section class="card context"><b>주문번호</b><span>${esc(c.selectedOrder.orderNo)}</span><b>수령인</b><span>${esc(c.recipient.name||'-')}</span><b>휴대전화</b><span>${esc(c.recipient.phoneMasked||'-')}</span></section>${c.note?`<div class="note">${esc(c.note)}</div>`:''}${c.bulkAvailable?`<p>동일 수령인의 취소 가능한 주문이 <b>${c.bulkSummary.orderCount}건</b> 있습니다.</p><section>${scopes}</section>`:scopes}<section id="preview" class="card preview"></section><label><b>취소 사유</b><select id="reason">${c.reasons.map(r=>`<option>${esc(r)}</option>`).join('')}</select></label><div class="actions"><button class="secondary" onclick="google.script.host.close()">취소하지 않음</button><button id="execute" class="primary" onclick="execute()">취소 실행</button></div>`;document.querySelectorAll('input[name=scope]').forEach(x=>x.onchange=updatePreview);updatePreview()}
function execute(){const scope=selectedScope();const s=scope==='RECIPIENT'?context.bulkSummary:context.singleSummary;const completed=s.completedOrderCount>0;const warning=completed?'\n\n일부 주문은 이미 출고 처리되었습니다.\n취소 시 해당 수량이 가용재고로 복원됩니다.':'';if(!confirm(`주문 ${s.orderCount}건 / 총 수량 ${s.totalQuantity}개를 취소할까요?\n대기 주문: ${s.waitingOrderCount}건\n출고완료 주문: ${s.completedOrderCount}건${warning}`))return;const btn=document.getElementById('execute');btn.disabled=true;btn.textContent='서버 재검증 및 취소 중…';const errDiv=document.getElementById('modal-error');if(errDiv)errDiv.style.display='none';google.script.run.withSuccessHandler(renderResult).withFailureHandler(fail).executeCancellationScope({selectedOrderNo,scope,reason:document.getElementById('reason').value,confirmCompleted:completed})}
function renderResult(r){const failures=r.failed.map(x=>`<div class="failure"><b>${esc(x.orderNo)}</b>: ${esc(x.reason)}</div>`).join('');document.getElementById('app').innerHTML=`<div class="success"><b>취소 처리 완료</b></div><section class="card"><p>대상 주문: <b>${r.requested}건</b><br>취소 성공: <b>${r.success}건</b><br>이미 취소: <b>${r.alreadyCancelled}건</b><br>실패: <b>${r.failed.length}건</b><br>재고 복원: <b>${r.restoredQuantity}개</b></p>${failures}</section><div class="actions"><button class="primary" onclick="google.script.host.close()">닫기</button></div>`}
google.script.run.withSuccessHandler(render).withFailureHandler(fail).getCancellationContext(selectedOrderNo);
</script></body></html>
