<!doctype html><html><head><base target="_top"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:13px "Malgun Gothic",sans-serif;color:#20242a;margin:0;background:#f5f7fa}header{padding:16px 20px;background:#1f3864;color:#fff}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.85;margin-top:4px}main{padding:16px 20px}.card{background:#fff;border:1px solid #d6dce5;border-radius:7px;padding:12px;margin-bottom:12px}.context{display:grid;grid-template-columns:80px 1fr;gap:5px}.muted{color:#667085}.scope{display:block;border:1px solid #d6dce5;border-radius:6px;padding:10px;margin:7px 0;background:#fff;cursor:pointer}.scope input{margin-right:7px}.summary{display:block;color:#667085;margin:4px 0 0 25px}.items{max-height:250px;overflow:auto}.item{display:flex;gap:8px;padding:10px 2px;border-bottom:1px solid #e4e7ec}.item:last-child{border-bottom:0}.item-info{min-width:0}.item-no{font-weight:bold}.item-detail{color:#667085;margin-top:3px}.cancelled{color:#8a94a3}.status{color:#b42318;margin-left:5px}.selection{font-weight:bold;margin:8px 0}.select-actions{display:flex;gap:6px;margin:8px 0}.select-actions button{padding:6px 10px}.order-note{margin:8px 0 0 25px;color:#667085}select{width:100%;padding:8px;border:1px solid #98a2b3;border-radius:5px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}button{border:0;border-radius:5px;padding:9px 16px;cursor:pointer}.primary{background:#1f3864;color:#fff}.secondary{background:#e8edf3}button:disabled{opacity:.5;cursor:default}.error{background:#ffe4e4;color:#8d2222;padding:9px;border-radius:5px;margin-bottom:10px}.notice{background:#fff4d6;color:#7a4d00;padding:9px;border-radius:5px;margin-bottom:12px}.success{background:#e2efda;color:#205c28;padding:12px;border-radius:6px}.failure{color:#b42318;margin-top:6px}
</style></head><body><header><h1>주문 취소</h1><div class="sub">현재 주문에서 품목을 선택하거나 주문 전체를 취소합니다.</div></header><main id="app"><p>취소 대상을 불러오는 중…</p></main><script>
const selectedOrderNo=<?!= orderNoJson ?>;const selectedItemOrderNo=<?!= itemOrderNoJson ?>;let context=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fail(e){const msg=esc(e&&e.message?e.message:e);const err=document.getElementById('modal-error');if(err){err.innerHTML=msg;err.style.display='block'}else{document.getElementById('app').innerHTML='<div class="error">'+msg+'</div><div class="actions"><button class="secondary" onclick="google.script.host.close()">닫기</button></div>'}const btn=document.getElementById('execute');if(btn){btn.disabled=!context||context.cancellableItemCount===0;btn.textContent='취소 실행'}}
function selectedScope(){const checked=document.querySelector('input[name=scope]:checked');return checked?checked.value:'ITEMS'}
function selectedItems(){return Array.from(document.querySelectorAll('.item-check:checked')).map(input=>input.value)}
function itemByNo(no){return context.items.find(item=>item.itemOrderNo===no)}
function updateSelection(){const orderScope=selectedScope()==='ORDER';document.querySelectorAll('.item-check').forEach(input=>{input.disabled=orderScope||!itemByNo(input.value).cancellable});document.getElementById('item-tools').style.display=orderScope?'none':'block';const selected=orderScope?context.items.filter(item=>item.cancellable):selectedItems().map(itemByNo);const quantity=selected.reduce((sum,item)=>sum+item.quantity,0);document.getElementById('selection').textContent=orderScope?`전체 취소 대상 ${selected.length}품목 / ${quantity}개`:`선택 ${selected.length}품목 / ${quantity}개`;document.getElementById('order-ignores').style.display=orderScope?'block':'none'}
function toggleAll(checked){document.querySelectorAll('.item-check').forEach(input=>{if(!input.disabled)input.checked=checked});updateSelection()}
function render(c){context=c;const itemHtml=c.items.map(item=>`<label class="item ${item.cancellable?'':'cancelled'}"><input class="item-check" type="checkbox" value="${esc(item.itemOrderNo)}" ${item.selected&&item.cancellable?'checked':''} ${item.cancellable?'':'disabled'}><span class="item-info"><span class="item-no">${esc(item.itemOrderNo)}</span>${item.cancellable?'':`<span class="status">취소됨</span>`}<div class="item-detail">${esc(item.productName)}${item.option?' / '+esc(item.option):''}<br>수량 ${item.quantity}${item.shippedOrCompleted?' · 출고 처리':''}</div></span></label>`).join('');const none=c.cancellableItemCount===0?'<div class="notice">이 주문의 모든 품목이 이미 취소되었습니다.</div>':'';document.getElementById('app').innerHTML=`<div id="modal-error" class="error" style="display:none"></div>${none}<section class="card context"><b>주문번호</b><span>${esc(c.orderNo)}</span><b>총 품목 수</b><span>${c.itemCount}품목</span><b>총 수량</b><span>${c.totalQuantity}개</span><b>취소 가능</b><span>${c.cancellableItemCount}품목 / ${c.cancellableQuantity}개</span></section><section><b>취소 범위</b><label class="scope"><input type="radio" name="scope" value="ITEMS" checked>품목 선택 취소</label><label class="scope"><input type="radio" name="scope" value="ORDER">현재 주문 전체 취소<div class="order-note">총 ${c.itemCount}품목 / ${c.totalQuantity}개</div></label></section><section class="card items">${itemHtml}</section><div id="item-tools"><div class="select-actions"><button class="secondary" type="button" onclick="toggleAll(true)">전체 선택</button><button class="secondary" type="button" onclick="toggleAll(false)">선택 해제</button></div></div><div id="order-ignores" class="muted" style="display:none">현재 주문 전체 취소는 체크박스 선택과 관계없이 취소 가능한 모든 품목을 처리합니다.</div><div id="selection" class="selection"></div><label><b>취소 사유</b><select id="reason">${c.reasons.map(reason=>`<option>${esc(reason)}</option>`).join('')}</select></label><div class="actions"><button class="secondary" onclick="google.script.host.close()">닫기</button><button id="execute" class="primary" onclick="execute()" ${c.cancellableItemCount?'':'disabled'}>취소 실행</button></div>`;document.querySelectorAll('input[name=scope],.item-check').forEach(input=>input.onchange=updateSelection);updateSelection()}
function execute(){const scope=selectedScope();const itemNos=selectedItems();if(scope==='ITEMS'&&!itemNos.length){fail({message:'취소할 품목을 하나 이상 선택하세요.'});return}const targets=scope==='ORDER'?context.items.filter(item=>item.cancellable):itemNos.map(itemByNo);const completed=targets.some(item=>item.shippedOrCompleted);const quantity=targets.reduce((sum,item)=>sum+item.quantity,0);const label=scope==='ORDER'?'현재 주문 전체':`선택 ${targets.length}품목`;const warning=completed?'\n\n출고 처리된 품목이 포함되어 있습니다.\n해당 실제 출고 수량이 가용재고로 복원됩니다.':'';if(!confirm(`${label} / 총 수량 ${quantity}개를 취소할까요?${warning}`))return;const btn=document.getElementById('execute');btn.disabled=true;btn.textContent='서버 재검증 및 취소 중…';const err=document.getElementById('modal-error');err.style.display='none';google.script.run.withSuccessHandler(renderResult).withFailureHandler(fail).executeCancellation({selectedOrderNo,scope,selectedItemOrderNos:itemNos,reason:document.getElementById('reason').value,confirmCompleted:completed})}
function renderResult(r){const failures=r.failedItems.map(item=>`<div class="failure"><b>${esc(item.itemOrderNo)}</b>: ${esc(item.reason)}</div>`).join('');document.getElementById('app').innerHTML=`<div class="success"><b>취소 처리 완료</b></div><section class="card"><p>취소 성공: <b>${r.successItems.length}건</b><br>이미 취소: <b>${r.alreadyCancelledItems.length}건</b><br>실패: <b>${r.failedItems.length}건</b><br>재고 복원: <b>${r.restoredQuantity}개</b></p>${failures}</section><div class="actions"><button class="primary" onclick="google.script.host.close()">닫기</button></div>`}
google.script.run.withSuccessHandler(render).withFailureHandler(fail).getCancellationContext(selectedOrderNo,selectedItemOrderNo);
</script></body></html>
